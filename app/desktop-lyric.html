<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>声浪桌面歌词</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: "Microsoft YaHei", sans-serif;
    }
    #wrap {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      box-sizing: border-box;
      border-radius: 12px;
      -webkit-app-region: drag;      /* 整块可拖动 */
      background: rgba(8, 12, 22, .35);
      border: 1px solid rgba(255, 255, 255, .10);
      transition: background .2s;
    }
    #wrap.locked { border-color: transparent; background: transparent; }
    #wrap:hover { background: rgba(8, 12, 22, .55); }
    .line {
      max-width: 100%;
      white-space: pre-line;
      text-align: center;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .9);
      transition: opacity .2s, font-size .2s;
    }
    #cur { font-weight: 700; color: #fff; }
    #next { font-weight: 500; color: rgba(255, 255, 255, .55); }
    #hint { color: rgba(255,255,255,.45); font-size: 13px; }
    /* 悬停工具条（不参与拖动） */
    #tools {
      position: absolute; top: 4px; right: 6px;
      display: none; gap: 4px;
      -webkit-app-region: no-drag;
    }
    #wrap:hover #tools { display: flex; }
    #tools button {
      -webkit-app-region: no-drag;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(20,26,40,.85);
      color: #dbe6f7;
      border-radius: 7px;
      font-size: 11px;
      padding: 2px 7px;
      cursor: pointer;
    }
    #tools button:hover { background: rgba(120,180,255,.3); color: #fff; }
    /* 动效 */
    #wrap.anim-breath #cur { animation: br 3.2s ease-in-out infinite; }
    @keyframes br { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
    #wrap.anim-pulse #cur { animation: pl 1.5s ease-in-out infinite; }
    @keyframes pl { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    #wrap.anim-neon #cur { animation: ne 2.6s linear infinite; }
    @keyframes ne {
      0% { text-shadow: 0 0 8px currentColor; }
      50% { text-shadow: 0 0 22px currentColor, 0 0 44px currentColor; }
      100% { text-shadow: 0 0 8px currentColor; }
    }
    .ch { opacity: .45; transition: opacity .15s linear; }
    .ch.hit { opacity: 1; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="tools">
      <button id="btn-minus" title="字号 -">A−</button>
      <button id="btn-plus" title="字号 +">A+</button>
      <button id="btn-lock" title="锁定（点击穿透）">🔒</button>
      <button id="btn-close" title="关闭桌面歌词">✕</button>
    </div>
    <div class="line" id="cur">声浪桌面歌词</div>
    <div class="line" id="next"></div>
    <div id="hint">播放歌曲后这里显示歌词 · 拖动可移动</div>
  </div>
  <script>
    (function () {
      'use strict';
      const wrap = document.getElementById('wrap');
      const cur = document.getElementById('cur');
      const next = document.getElementById('next');
      const hint = document.getElementById('hint');
      let style = { size: 30, color: '#ffffff', font: 'system', weight: 700, lines: 2, anim: 'none', shadow: true };
      let locked = false;
      const api = window.songwave || {};

      function applyStyle() {
        cur.style.fontSize = style.size + 'px';
        cur.style.fontWeight = String(style.weight || 700);
        cur.style.color = style.color || '#fff';
        cur.style.fontFamily = style.font === 'system' ? '' : ('"' + style.font + '", sans-serif');
        next.style.fontSize = Math.max(12, (style.size || 30) - 8) + 'px';
        next.style.fontFamily = cur.style.fontFamily;
        next.style.display = Number(style.lines) >= 2 ? '' : 'none';
        wrap.classList.remove('anim-none', 'anim-breath', 'anim-karaoke', 'anim-pulse', 'anim-neon');
        wrap.classList.add('anim-' + (style.anim || 'none'));
        if (style.shadow === false) {
          cur.style.textShadow = 'none';
          next.style.textShadow = 'none';
        }
        wrap.classList.toggle('locked', locked);
        document.getElementById('btn-lock').textContent = locked ? '🔓' : '🔒';
      }

      function renderText() {
        hint.style.display = cur.textContent && cur.textContent !== '声浪桌面歌词' ? 'none' : '';
      }

      // 主进程推来的数据
      if (api.onLyricWindowData) {
        api.onLyricWindowData((d) => {
          if (!d) return;
          if (d.style) style = Object.assign(style, d.style);
          locked = !!d.locked;
          if (d.text) { cur.textContent = d.text; hint.style.display = 'none'; }
          next.textContent = d.next || '';
          applyStyle();
        });
      }

      // 按钮
      document.getElementById('btn-close').onclick = () => api.lyricWindow && api.lyricWindow({ action: 'close' });
      document.getElementById('btn-lock').onclick = () => {
        locked = !locked;
        if (api.lyricWindow) api.lyricWindow({ locked });
        applyStyle();
      };
      document.getElementById('btn-plus').onclick = () => {
        style.size = Math.min(72, (style.size || 30) + 2);
        if (api.lyricPush) api.lyricPush({ text: cur.textContent, next: next.textContent, style });
        applyStyle();
      };
      document.getElementById('btn-minus').onclick = () => {
        style.size = Math.max(14, (style.size || 30) - 2);
        if (api.lyricPush) api.lyricPush({ text: cur.textContent, next: next.textContent, style });
        applyStyle();
      };

      // 快捷键：Esc 隐藏（锁定状态下不响应，因为没有焦点）
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') api.lyricWindow && api.lyricWindow({ action: 'close' });
      });

      applyStyle();
      renderText();
    })();
  </script>
</body>
</html>
