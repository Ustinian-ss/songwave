<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#060810">
  <title>声浪 SongWave</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <!-- 桌面歌词（沉浸 / 壁纸模式） -->
  <div id="desktop-lyric" class="hidden"></div>

  <!-- Wallpaper Engine 背景层（模仿 dsh-plugin-wallpaper-engine 的效果） -->
  <div id="we-bg" class="hidden">
    <video id="we-video" playsinline muted loop></video>
    <img id="we-img" alt="">
    <div id="we-scrim"></div>
  </div>

  <canvas id="stage"></canvas>

  <!-- 顶部：窗口控制 + 标题 -->
  <div id="ui">
    <div id="drag-bar"></div>
    <div id="win-btns">
      <button class="wb" id="wb-min" title="最小化">—</button>
      <button class="wb" id="wb-max" title="最大化">□</button>
      <button class="wb wb-close" id="wb-close" title="关闭">✕</button>
    </div>
    <div id="title">声浪 · SongWave</div>
    <div id="hint">左侧搜索在线音乐，或「本地音乐」导入文件</div>
  </div>

  <!-- 左侧功能栏（竖向功能栏） -->
  <nav id="rail">
    <button class="rail-btn active" data-view="search" title="搜索">🔍</button>
    <button class="rail-btn" data-view="list" title="播放列表">☰</button>
    <button class="rail-btn" data-view="favorites" title="我喜欢">♥</button>
    <button class="rail-btn" data-view="history" title="播放历史">🕘</button>
    <button class="rail-btn" data-view="lyric" title="歌词">♪</button>
    <button class="rail-btn" id="btn-wallpaper" data-view="wallpaper" title="壁纸/沉浸模式（Esc 或 W 退出，桌面层 Ctrl+Alt+W）">🖼</button>
    <button class="rail-btn" data-view="panel" title="设置 / 音源管理">⚙</button>
  </nav>

  <!-- 左侧：搜索 / 播放列表 -->
  <aside id="sidebar">
    <div class="side-head">
      <button class="tab active" data-tab="search">搜索</button>
      <button class="tab" data-tab="list">播放列表</button>
      <button class="tab" data-tab="lyric">歌词</button>
    </div>
    <div class="side-body" id="side-search">
      <div class="search-row">
        <input id="search-input" placeholder="搜索歌曲 / 歌手 / 专辑" spellcheck="false">
        <button class="btn btn-primary" id="search-btn">搜索</button>
      </div>
      <div class="row chips" id="src-chips">
        <button class="btn chip active" data-src="netease">网易云</button>
        <button class="btn chip" data-src="qq">QQ</button>
        <button class="btn chip" data-src="kugou">酷狗</button>
        <button class="btn chip" data-src="kuwo">酷我</button>
        <button class="btn chip" data-src="migu">咪咕</button>
      </div>
      <div id="search-history" class="search-history"></div>
      <div id="results" class="result-list"></div>
    </div>
    <div class="side-body hidden" id="side-list">
      <div class="list-tools">
        <button class="btn" id="btn-local">📁 本地音乐</button>
        <button class="btn" id="btn-pl-import" title="导入外部歌单（粘贴链接或文本）">📥 歌单</button>
        <button class="btn" id="btn-save-dir" title="设置下载目录">⤓</button>
        <button class="btn" id="btn-clear-list" title="清空播放列表">🗑</button>
      </div>
      <div id="pl-import" class="pl-import hidden">
        <textarea id="pl-import-text" placeholder="粘贴歌单链接（网易云 / QQ 音乐），或每行一首「歌名 - 歌手」" spellcheck="false"></textarea>
        <div class="row">
          <button class="btn btn-primary" id="pl-import-btn">导入</button>
          <button class="btn" id="pl-import-file">从文件</button>
          <button class="btn mini" id="pl-import-close">✕</button>
        </div>
      </div>
      <div id="playlist" class="vlist"></div>
    </div>
    <div class="side-body hidden" id="side-lyric">
      <div class="lyric-tools">
        <button class="btn mini" id="lyr-minus" title="歌词提前 0.5s">−0.5s</button>
        <span class="lyric-offset" id="lyric-offset-val">0.0s</span>
        <button class="btn mini" id="lyr-plus" title="歌词延后 0.5s">+0.5s</button>
        <button class="btn mini" id="lyr-reset" title="重置偏移">重置</button>
      </div>
      <div id="lyric" class="lyric-list"></div>
    </div>
    <div class="side-body hidden" id="side-favorites">
      <div class="list-tools">
        <button class="btn" id="btn-fav-play">▶ 播放全部</button>
        <button class="btn" id="btn-fav-clear" title="清空收藏">🗑</button>
      </div>
      <div id="favorites" class="vlist"></div>
    </div>
    <div class="side-body hidden" id="side-history">
      <div class="list-tools">
        <button class="btn" id="btn-hist-clear" title="清空历史">🗑 清空历史</button>
      </div>
      <div id="history" class="vlist"></div>
    </div>
    <div id="ext-status" class="ext-status" title="音源状态">音源加载中…</div>
  </aside>

  <!-- 底部播放条 -->
  <div id="player">
    <div id="now">
      <div id="cover-wrap"><img id="cover" alt=""></div>
      <div class="now-meta">
        <div id="now-title">未在播放</div>
        <div id="now-artist">—</div>
      </div>
    </div>
    <div class="player-mid">
      <div class="player-btns">
        <button class="btn" id="btn-mode" title="播放模式：顺序播放">➡</button>
        <button class="btn" id="btn-prev" title="上一首">⏮</button>
        <button class="btn btn-primary" id="btn-play" title="播放 / 暂停">▶</button>
        <button class="btn" id="btn-next" title="下一首">⏭</button>
        <button class="btn" id="btn-fav" title="收藏到「我喜欢」">♡</button>
        <button class="btn" id="btn-rate" title="播放速度">1.0x</button>
        <button class="btn" id="btn-sleep" title="定时停止播放">⏱</button>
      </div>
      <div class="progress-row">
        <span id="time-cur">0:00</span>
        <input type="range" id="progress" min="0" max="1000" value="0" title="进度">
        <span id="time-total">0:00</span>
        <input type="range" id="volume" min="0" max="100" value="80" title="音量">
        <button class="btn panel-toggle" id="btn-panel" title="可视化面板">⚙ 面板</button>
      </div>
    </div>
  </div>

  <!-- 播放详情页：点左下角封面进入，歌词居中显示 -->
  <div id="now-playing" class="hidden">
    <div class="np-close" id="np-close" title="关闭（Esc）">✕</div>
    <div class="np-body">
      <div class="np-left">
        <div class="np-disc" id="np-disc"><img id="np-cover" alt=""><div class="np-hole"></div></div>
        <div class="np-title" id="np-title">未在播放</div>
        <div class="np-artist" id="np-artist">—</div>
        <div class="np-progress">
          <span id="np-cur">0:00</span>
          <input type="range" id="np-progress" min="0" max="1000" value="0">
          <span id="np-total">0:00</span>
        </div>
        <div class="np-tools">
          <button class="btn" id="np-prev" title="上一首">⏮</button>
          <button class="btn btn-primary" id="np-play" title="播放 / 暂停">▶</button>
          <button class="btn" id="np-next" title="下一首">⏭</button>
          <button class="btn" id="np-fav" title="收藏">♡</button>
          <button class="btn" id="np-mode" title="播放模式">➡</button>
        </div>
      </div>
      <div class="np-lyric" id="np-lyric"><div class="lyric-empty">播放歌曲后这里显示歌词</div></div>
    </div>
  </div>

  <!-- 右侧：可视化参数面板（复用 Song-Life） -->
  <div id="panel">
    <div class="panel-head">
      <span>可视化面板</span>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="panel-body">
      <!-- 音源管理（自定义音源：粘贴链接导入） -->
      <div class="panel-group">
        <div class="panel-title">
          <span>音源管理 · 自定义音源</span>
          <button class="btn mini" id="src-refresh" title="重新检测">↻</button>
        </div>
        <div class="src-add">
          <input id="src-url" placeholder="粘贴音源链接（http/https 的 .js）" spellcheck="false">
          <button class="btn btn-primary" id="src-add-btn">导入</button>
        </div>
        <div class="row src-tools">
          <button class="btn" id="src-import-external" title="自动探测其它播放器的音源脚本并批量导入">从其它播放器导入</button>
          <button class="btn" id="src-import-dir">文件夹导入</button>
          <button class="btn" id="src-pick">选文件</button>
        </div>
        <div class="row src-tools">
          <span class="src-hint" id="src-hint">未装入音源时，QQ/酷狗/酷我/咪咕 无法播放</span>
        </div>
        <div class="row src-tools">
          <label class="chk"><input type="checkbox" id="chk-autoswitch" checked> 播放失败自动换源（换平台找同一首歌）</label>
        </div>
        <div id="src-list"><div class="we-empty">加载中…</div></div>
      </div>

      <div class="panel-group">
        <div class="panel-title">色彩主题</div>
        <div id="themes" class="row"></div>
      </div>

      <!-- Wallpaper Engine 背景 -->
      <div class="panel-group">
        <div class="panel-title">
          <span>背景 · Wallpaper Engine</span>
          <button class="btn mini" id="we-refresh" title="重新扫描壁纸库">↻</button>
        </div>
        <div class="row" id="bg-modes">
          <button class="btn mode active" data-bgmode="viz">仅可视化</button>
          <button class="btn mode" data-bgmode="we">仅壁纸</button>
          <button class="btn mode" data-bgmode="blend">叠加</button>
        </div>
        <div class="param">
          <label>遮罩 <span id="v-scrim">10%</span></label>
          <input type="range" id="bg-scrim" min="0" max="0.8" step="0.02" value="0.1">
        </div>
        <div class="param">
          <label>背景模糊 <span id="v-blur">0px</span></label>
          <input type="range" id="bg-blur" min="0" max="30" step="1" value="0">
        </div>
        <div class="param">
          <label>亮度 <span id="v-bright2">100%</span></label>
          <input type="range" id="bg-bright" min="30" max="170" step="5" value="100">
        </div>
        <div class="param">
          <label>对比度 <span id="v-contrast">100%</span></label>
          <input type="range" id="bg-contrast" min="30" max="200" step="5" value="100">
        </div>
        <div class="param">
          <label>饱和度 <span id="v-saturate">100%</span></label>
          <input type="range" id="bg-saturate" min="0" max="250" step="5" value="100">
        </div>
        <div class="param">
          <label>可视化不透明度 <span id="v-vizop">85%</span></label>
          <input type="range" id="bg-vizop" min="0" max="1" step="0.05" value="0.85">
        </div>
        <div class="param">
          <label>填充方式</label>
          <select id="bg-fit">
            <option value="cover">铺满裁切（cover）</option>
            <option value="contain">完整显示（contain）</option>
            <option value="fill">拉伸（fill）</option>
          </select>
        </div>
        <div class="param">
          <label>视频速度 <span id="v-rate">1.00x</span></label>
          <input type="range" id="bg-rate" min="0.25" max="2" step="0.05" value="1">
        </div>
        <div class="param row-inline">
          <label><input type="checkbox" id="bg-flip"> 水平翻转</label>
          <label><input type="checkbox" id="bg-rotate"> 轮播</label>
        </div>
        <div class="param">
          <label>轮播间隔 <span id="v-rot">30s</span></label>
          <input type="range" id="bg-rot" min="5" max="300" step="5" value="30">
        </div>
        <div id="we-list"><div class="we-empty">正在扫描壁纸库…</div></div>
      </div>
      <div class="panel-group">
        <div class="panel-title">音域地形</div>
        <div class="param">
          <label>律动强度 <span id="v-height">100%</span></label>
          <input type="range" id="p-height" min="0.2" max="2" step="0.05" value="1.0">
        </div>
        <div class="param">
          <label>响应速度 <span id="v-response">0.50</span></label>
          <input type="range" id="p-response" min="0.1" max="0.9" step="0.01" value="0.5">
        </div>
        <div class="param">
          <label>闪烁强度 <span id="v-flash">100%</span></label>
          <input type="range" id="p-flash" min="0" max="2" step="0.05" value="1.0">
        </div>
        <div class="param">
          <label>亮度 <span id="v-bright">100%</span></label>
          <input type="range" id="p-bright" min="0.3" max="1.6" step="0.05" value="1.0">
        </div>
        <div class="param">
          <label>俯视视角 <span id="v-tilt">0.42</span></label>
          <input type="range" id="p-tilt" min="0.2" max="0.7" step="0.01" value="0.42">
        </div>
        <div class="param">
          <label>色相偏移 <span id="v-hueshift">0</span></label>
          <input type="range" id="p-hueshift" min="-180" max="180" step="1" value="0">
        </div>
        <div class="param">
          <label>鼠标波动 <span id="v-mousewave">100%</span></label>
          <input type="range" id="p-mousewave" min="0" max="2" step="0.05" value="1.0">
        </div>
        <div class="param">
          <label>音柱材质</label>
          <select id="p-barstyle">
            <option value="glass" selected>玻璃（半透明）</option>
            <option value="acrylic">亚克力（磨砂）</option>
            <option value="solid">实心</option>
            <option value="glow">发光</option>
          </select>
        </div>
        <div class="param">
          <label>材质模糊 <span id="v-barblur">6px</span></label>
          <input type="range" id="p-barblur" min="0" max="30" step="1" value="6">
        </div>
        <div class="param">
          <label>材质透明度 <span id="v-baralpha">1.00</span></label>
          <input type="range" id="p-baralpha" min="0.2" max="2" step="0.05" value="1">
        </div>
        <div class="param">
          <label>高光强度 <span id="v-barglow">1.00</span></label>
          <input type="range" id="p-barglow" min="0" max="2" step="0.05" value="1">
        </div>
        <div class="param">
          <label>柱体圆角 <span id="v-barround">2px</span></label>
          <input type="range" id="p-barround" min="0" max="14" step="1" value="2">
        </div>
      </div>

      <!-- 色彩混搭 + 桌面歌词 -->
      <div class="panel-group">
        <div class="panel-title">色彩混搭（自选两色渐变）</div>
        <div class="param color-row">
          <label>主色</label>
          <input type="color" id="p-colora" value="#67dce7">
          <label>副色</label>
          <input type="color" id="p-colorb" value="#ff6bae">
        </div>
        <div class="param">
          <label>混搭强度 <span id="v-colormix">0%</span></label>
          <input type="range" id="p-colormix" min="0" max="1" step="0.05" value="0">
        </div>
      </div>

      <!-- 音效：10 段 EQ + 混响 -->
      <div class="panel-group">
        <div class="panel-title">音效（10 段 EQ · 混响）</div>
        <div class="param row-inline">
          <label><input type="checkbox" id="fx-enable"> 启用音效</label>
          <label class="fx-hint" id="fx-hint">启用后可视化切为直连模式</label>
        </div>
        <div class="param">
          <label>预设</label>
          <select id="fx-preset"></select>
        </div>
        <div id="eq-bands" class="eq-bands"></div>
        <div class="param">
          <label>混响 <span id="v-fxreverb">0%</span></label>
          <input type="range" id="fx-reverb" min="0" max="1" step="0.05" value="0">
        </div>
        <div class="row src-tools">
          <button class="btn mini" id="fx-reset">重置为原声</button>
        </div>
      </div>

      <!-- 桌面歌词（沉浸 / 壁纸模式显示） -->
      <div class="panel-group">
        <div class="panel-title">桌面歌词（沉浸 / 壁纸模式）</div>
        <div class="param row-inline">
          <label><input type="checkbox" id="dl-enable"> 启用</label>
          <label><input type="checkbox" id="dl-shadow" checked> 描边阴影</label>
        </div>
        <div class="param">
          <label>位置</label>
          <select id="dl-pos">
            <option value="bottom">底部</option>
            <option value="top">顶部</option>
            <option value="left">左侧（竖排居中）</option>
            <option value="right">右侧（竖排居中）</option>
          </select>
        </div>
        <div class="param">
          <label>对齐</label>
          <select id="dl-align">
            <option value="center">居中</option>
            <option value="left">左对齐</option>
            <option value="right">右对齐</option>
          </select>
        </div>
        <div class="param">
          <label>行数</label>
          <select id="dl-lines">
            <option value="1">一行</option>
            <option value="2">两行（当前 + 下一句）</option>
          </select>
        </div>
        <div class="param">
          <label>字号 <span id="v-dlsize">30px</span></label>
          <input type="range" id="dl-size" min="14" max="72" step="1" value="30">
        </div>
        <div class="param">
          <label>字重 <span id="v-dlweight">600</span></label>
          <input type="range" id="dl-weight" min="300" max="900" step="100" value="600">
        </div>
        <div class="param color-row">
          <label>歌词颜色</label>
          <input type="color" id="dl-color" value="#ffffff">
        </div>
        <div class="param">
          <label>字体</label>
          <select id="dl-font">
            <option value="system">系统默认</option>
            <option value="Microsoft YaHei">微软雅黑</option>
            <option value="SimHei">黑体</option>
            <option value="SimSun">宋体</option>
            <option value="KaiTi">楷体</option>
          </select>
        </div>
        <div class="param">
          <label>歌词动效</label>
          <select id="dl-anim">
            <option value="none">无</option>
            <option value="breath">呼吸</option>
            <option value="karaoke">逐字扫过</option>
            <option value="pulse">律动缩放</option>
            <option value="neon">霓虹发光</option>
          </select>
        </div>
      </div>
      <div class="panel-group">
        <div class="panel-title">提示文字</div>
        <input type="text" id="hint-input" placeholder="输入自定义提示文字">
      </div>
    </div>
  </div>

  <audio id="audio"></audio>
  <div id="status"></div>

  <script src="engine.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
