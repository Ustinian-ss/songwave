<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#060810">
  <title>声浪 SongWave</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <!-- Wallpaper Engine 背景层（模仿 dsh-plugin-wallpaper-engine 的效果） -->
  <div id="we-bg" class="hidden">
    <video id="we-video" playsinline muted loop></video>
    <img id="we-img" alt="">
    <div id="we-scrim"></div>
  </div>

  <canvas id="stage"></canvas>

  <!-- 顶部：窗口控制 + 标题 -->
  <div id="ui">
    <div id="drag-bar"></div>
    <div id="win-btns">
      <button class="wb" id="wb-min" title="最小化">—</button>
      <button class="wb" id="wb-max" title="最大化">□</button>
      <button class="wb wb-close" id="wb-close" title="关闭">✕</button>
    </div>
    <div id="title">声浪 · SongWave</div>
    <div id="hint">左侧搜索在线音乐，或「本地音乐」导入文件</div>
  </div>

  <!-- 左侧功能栏（对齐 LX Music 的竖向导航） -->
  <nav id="rail">
    <button class="rail-btn active" data-view="search" title="搜索">🔍</button>
    <button class="rail-btn" data-view="list" title="播放列表">☰</button>
    <button class="rail-btn" data-view="lyric" title="歌词">♪</button>
    <button class="rail-btn" id="btn-wallpaper" data-view="wallpaper" title="壁纸/沉浸模式（Esc 或 W 退出，桌面层 Ctrl+Alt+W）">🖼</button>
    <button class="rail-btn" data-view="panel" title="设置 / 音源管理">⚙</button>
  </nav>

  <!-- 左侧：搜索 / 播放列表 -->
  <aside id="sidebar">
    <div class="side-head">
      <button class="tab active" data-tab="search">搜索</button>
      <button class="tab" data-tab="list">播放列表</button>
      <button class="tab" data-tab="lyric">歌词</button>
    </div>
    <div class="side-body" id="side-search">
      <div class="search-row">
        <input id="search-input" placeholder="搜索歌曲 / 歌手 / 专辑" spellcheck="false">
        <button class="btn btn-primary" id="search-btn">搜索</button>
      </div>
      <div class="row chips" id="src-chips">
        <button class="btn chip active" data-src="netease">网易云</button>
        <button class="btn chip" data-src="qq">QQ</button>
        <button class="btn chip" data-src="kugou">酷狗</button>
        <button class="btn chip" data-src="kuwo">酷我</button>
        <button class="btn chip" data-src="migu">咪咕</button>
      </div>
      <div id="results" class="result-list"></div>
    </div>
    <div class="side-body hidden" id="side-list">
      <div class="list-tools">
        <button class="btn" id="btn-local">📁 本地音乐</button>
        <button class="btn" id="btn-save-dir" title="设置下载目录">⤓ 下载目录</button>
        <button class="btn" id="btn-clear-list" title="清空播放列表">🗑</button>
      </div>
      <div id="playlist" class="vlist"></div>
    </div>
    <div class="side-body hidden" id="side-lyric">
      <div id="lyric" class="lyric-list"></div>
    </div>
    <div id="lx-status" class="lx-status" title="音源状态">音源加载中…</div>
  </aside>

  <!-- 底部播放条 -->
  <div id="player">
    <div id="now">
      <div id="cover-wrap"><img id="cover" alt=""></div>
      <div class="now-meta">
        <div id="now-title">未在播放</div>
        <div id="now-artist">—</div>
      </div>
    </div>
    <div class="player-mid">
      <div class="player-btns">
        <button class="btn" id="btn-prev" title="上一首">⏮</button>
        <button class="btn btn-primary" id="btn-play" title="播放 / 暂停">▶</button>
        <button class="btn" id="btn-next" title="下一首">⏭</button>
      </div>
      <div class="progress-row">
        <span id="time-cur">0:00</span>
        <input type="range" id="progress" min="0" max="1000" value="0" title="进度">
        <span id="time-total">0:00</span>
        <input type="range" id="volume" min="0" max="100" value="80" title="音量">
        <button class="btn panel-toggle" id="btn-panel" title="可视化面板">⚙ 面板</button>
      </div>
    </div>
  </div>

  <!-- 右侧：可视化参数面板（复用 Song-Life） -->
  <div id="panel">
    <div class="panel-head">
      <span>可视化面板</span>
      <button class="panel-close" id="panel-close">✕</button>
    </div>
    <div class="panel-body">
      <!-- 音源管理（对齐 LX Music 的“自定义源”：粘贴链接导入） -->
      <div class="panel-group">
        <div class="panel-title">
          <span>音源管理 · lx 自定义源</span>
          <button class="btn mini" id="src-refresh" title="重新检测">↻</button>
        </div>
        <div class="src-add">
          <input id="src-url" placeholder="粘贴音源链接（http/https 的 .js）" spellcheck="false">
          <button class="btn btn-primary" id="src-add-btn">导入</button>
        </div>
        <div class="row src-tools">
          <button class="btn" id="src-pick">从文件导入</button>
          <span class="src-hint" id="src-hint">未装入音源时，QQ/酷狗/酷我/咪咕 无法播放</span>
        </div>
        <div id="src-list"><div class="we-empty">加载中…</div></div>
      </div>

      <div class="panel-group">
        <div class="panel-title">色彩主题</div>
        <div id="themes" class="row"></div>
      </div>

      <!-- Wallpaper Engine 背景 -->
      <div class="panel-group">
        <div class="panel-title">
          <span>背景 · Wallpaper Engine</span>
          <button class="btn mini" id="we-refresh" title="重新扫描壁纸库">↻</button>
        </div>
        <div class="row" id="bg-modes">
          <button class="btn mode active" data-bgmode="viz">仅可视化</button>
          <button class="btn mode" data-bgmode="we">仅壁纸</button>
          <button class="btn mode" data-bgmode="blend">叠加</button>
        </div>
        <div class="param">
          <label>遮罩 <span id="v-scrim">10%</span></label>
          <input type="range" id="bg-scrim" min="0" max="0.8" step="0.02" value="0.1">
        </div>
        <div class="param">
          <label>背景模糊 <span id="v-blur">0px</span></label>
          <input type="range" id="bg-blur" min="0" max="30" step="1" value="0">
        </div>
        <div class="param">
          <label>亮度 <span id="v-bright2">100%</span></label>
          <input type="range" id="bg-bright" min="30" max="170" step="5" value="100">
        </div>
        <div class="param">
          <label>对比度 <span id="v-contrast">100%</span></label>
          <input type="range" id="bg-contrast" min="30" max="200" step="5" value="100">
        </div>
        <div class="param">
          <label>饱和度 <span id="v-saturate">100%</span></label>
          <input type="range" id="bg-saturate" min="0" max="250" step="5" value="100">
        </div>
        <div class="param">
          <label>可视化不透明度 <span id="v-vizop">85%</span></label>
          <input type="range" id="bg-vizop" min="0" max="1" step="0.05" value="0.85">
        </div>
        <div class="param">
          <label>填充方式</label>
          <select id="bg-fit">
            <option value="cover">铺满裁切（cover）</option>
            <option value="contain">完整显示（contain）</option>
            <option value="fill">拉伸（fill）</option>
          </select>
        </div>
        <div class="param">
          <label>视频速度 <span id="v-rate">1.00x</span></label>
          <input type="range" id="bg-rate" min="0.25" max="2" step="0.05" value="1">
        </div>
        <div class="param row-inline">
          <label><input type="checkbox" id="bg-flip"> 水平翻转</label>
          <label><input type="checkbox" id="bg-rotate"> 轮播</label>
        </div>
        <div class="param">
          <label>轮播间隔 <span id="v-rot">30s</span></label>
          <input type="range" id="bg-rot" min="5" max="300" step="5" value="30">
        </div>
        <div id="we-list"><div class="we-empty">正在扫描壁纸库…</div></div>
      </div>
      <div class="panel-group">
        <div class="panel-title">音域地形</div>
        <div class="param">
          <label>律动强度 <span id="v-height">100%</span></label>
          <input type="range" id="p-height" min="0.2" max="2" step="0.05" value="1.0">
        </div>
        <div class="param">
          <label>响应速度 <span id="v-response">0.50</span></label>
          <input type="range" id="p-response" min="0.1" max="0.9" step="0.01" value="0.5">
        </div>
        <div class="param">
          <label>闪烁强度 <span id="v-flash">100%</span></label>
          <input type="range" id="p-flash" min="0" max="2" step="0.05" value="1.0">
        </div>
        <div class="param">
          <label>亮度 <span id="v-bright">100%</span></label>
          <input type="range" id="p-bright" min="0.3" max="1.6" step="0.05" value="1.0">
        </div>
        <div class="param">
          <label>俯视视角 <span id="v-tilt">0.42</span></label>
          <input type="range" id="p-tilt" min="0.2" max="0.7" step="0.01" value="0.42">
        </div>
        <div class="param">
          <label>色相偏移 <span id="v-hueshift">0</span></label>
          <input type="range" id="p-hueshift" min="-180" max="180" step="1" value="0">
        </div>
        <div class="param">
          <label>鼠标波动 <span id="v-mousewave">100%</span></label>
          <input type="range" id="p-mousewave" min="0" max="2" step="0.05" value="1.0">
        </div>
        <div class="param">
          <label>音柱材质</label>
          <select id="p-barstyle">
            <option value="glass" selected>玻璃（半透明）</option>
            <option value="solid">实心</option>
            <option value="glow">发光</option>
          </select>
        </div>
      </div>
      <div class="panel-group">
        <div class="panel-title">提示文字</div>
        <input type="text" id="hint-input" placeholder="输入自定义提示文字">
      </div>
    </div>
  </div>

  <audio id="audio"></audio>
  <div id="status"></div>

  <script src="engine.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
